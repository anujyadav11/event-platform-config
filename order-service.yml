server:
  port: 8081

spring:
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${ORDER_DB_USERNAME:postgres}
    password: ${ORDER_DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency : 3
      observation-enabled: true

    producer:
      acks: all
      enable-idempotence: true
      compression-type: lz4
      batch-size: 32768
      properties:
        linger.ms: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5

      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: order-outbox-tx-


    consumer:
      group-id: order-group
      enable-auto-commit: false
      max-poll-records: 100
      max-poll-interval-ms: 300000
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.example.eventstream.common,com.example.eventstream.common.*,com.example.infrastructure.audit.model"


        fetch.min.bytes: 16384
        fetch.max.wait.ms: 100

    outbox:
      publisher:
        fixed-delay: 5000
      recovery:
        fixed-delay: 60000
        processing-timeout: 5m

resilience4j:
  circuitbreaker:
    instances:
      pricingService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      pricingService:
        maxAttempts: 3
        waitDuration: 2s

  timelimiter:
    instances:
      pricingService:
        timeoutDuration: 3s

pricing-service:
  base-url: ${PRICING_SERVICE_BASE_URL:http://PRICING-SERVICE}

logging:
  level:
    root: INFO
    com.example.eventstream.order: DEBUG

management:
  health:
    circuitbreakers:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
